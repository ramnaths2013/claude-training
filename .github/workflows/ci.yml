name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden APIs
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|cookie|!important' index.html; then
            echo "Forbidden API or !important found"; exit 1
          fi
      - name: No external resources
        run: |
          if grep -nE '(src|href)=["'"'"']https?://' index.html; then
            echo "External resource found"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test (8 seeded cards, no console errors)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'node:url';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          await page.goto(pathToFileURL(process.cwd() + '/index.html').href);
          const n = await page.locator('text=/UOB-ITPM-\\d{4}/').count();
          await browser.close();
          if (n < 8) { console.error('Expected 8 seeded cards, found ' + n); process.exit(1); }
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          console.log('OK: ' + n + ' cards');
          JS
          node smoke.mjs
